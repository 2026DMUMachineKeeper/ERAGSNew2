<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="fadeRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="5%" stop-color="#ff0000" stop-opacity="0" />
      <stop offset="20%" stop-color="#ff0000" stop-opacity="1" />
      <stop offset="80%" stop-color="#ff0000" stop-opacity="1" />
      <stop offset="95%" stop-color="#ff0000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fadeWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="5%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="95%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    
    <path d="M 50 200 L 250 200 L 270 240 L 295 90 L 325 310 L 350 180 L 365 210 L 390 200 L 410 230 L 430 140 L 450 240 L 465 180 L 480 200 L 750 200"
          stroke="url(#fadeRed)" stroke-width="12" opacity="0.25" filter="url(#glow)" />

    <path d="M 50 200 L 250 200 L 270 240 L 295 90 L 325 310 L 350 180 L 365 210 L 390 200 L 410 230 L 430 140 L 450 240 L 465 180 L 480 200 L 750 200"
          stroke="url(#fadeRed)" stroke-width="6" opacity="0.6" filter="url(#glow)" />

    <path d="M 50 200 L 250 200 L 270 240 L 295 90 L 325 310 L 350 180 L 365 210 L 390 200 L 410 230 L 430 140 L 450 240 L 465 180 L 480 200 L 750 200"
          stroke="url(#fadeRed)" stroke-width="3" />

    <path d="M 50 200 L 250 200 L 270 240 L 295 90 L 325 310 L 350 180 L 365 210 L 390 200 L 410 230 L 430 140 L 450 240 L 465 180 L 480 200 L 750 200"
          stroke="url(#fadeWhite)" stroke-width="1" />
  </g>
</svg>
